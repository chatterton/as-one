info:
  name: Latest Readings for a Single Sensor
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/sensors/{{first-sensor-name}}"
  auth: inherit

runtime:
  variables:
    - name: first-sensor-name
      value: simulator1164961333
  scripts:
    - type: after-response
      code: |-
        test("Expect successful response of a json array", function () {
            expect(res.getStatus()).to.be.within(200, 299);
            expect(res.getHeader('Content-Type')).to.match(/^application\/json/i);
            var check = JSON.parse(JSON.stringify(res.getBody()));
            expect(Array.isArray(check));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: JSON array of readings, intended to be polled for a line chart or similar
