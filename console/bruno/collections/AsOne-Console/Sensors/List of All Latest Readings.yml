info:
  name: List of All Latest Readings
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/sensors/latest"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Expect successful response of a json array", function () {
            expect(res.getStatus()).to.be.within(200, 299);
            expect(res.getHeader('Content-Type')).to.match(/^application\/json/i);
            expect(res.getBody()).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: JSON array of readings, intended to be polled for a line chart or similar
