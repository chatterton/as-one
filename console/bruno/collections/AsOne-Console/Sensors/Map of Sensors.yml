info:
  name: Map of Sensors
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/sensors"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Expect successful response of a map", function () {
            expect(res.getStatus()).to.be.within(200, 299);
            expect(res.getHeader('Content-Type')).to.match(/^application\/json/i);
            expect(res.getBody()).to.be.an('object');
        });

        // save a sensor name for use elsewhere if needed
        var sensorNames = Object.keys(res.getBody() || {});
        if (sensorNames.length > 0) {
            bru.setVar("first-sensor-name", sensorNames[0]);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Map of sensor to position
