info:
  name: Get Simulator
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}{{simulator-path}}"
  auth: inherit

runtime:
  variables:
    - name: simulator-path
      value: /sensors/simulated/simulator300937266

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
