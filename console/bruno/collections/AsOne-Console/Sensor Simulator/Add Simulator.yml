info:
  name: Add Simulator
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/sensors/simulated/add"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Make sure the creation was successful
        test("Expect simulator to have been created", function () {
            expect(res.getStatus()).to.equal("Created");
        });

        // Save the path for use in later requests
        bru.setVar("simulator-path", res.getBody());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
