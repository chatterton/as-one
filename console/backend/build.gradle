plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'org.jetbrains.kotlin.kapt' version '2.4.21'
    id 'application'
    // provides 'gradle dependencyUpdates'
    id 'io.github.ben-manes.versions' version '0.67.0'
}

// Compile with JDK 25 and emit Java 25 bytecode, regardless of which JDK
// happens to be running Gradle (IntelliJ, jenv, the deploy box, etc.)
kotlin {
    jvmToolchain(25)
}

application {
    mainClass = 'org.perpetualthrill.asone.console.ConsoleStatic'
}

group = 'org.perpetualthrill.asone.console'
version = '0.1'

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

// Thanks, IDEA. How come the preprocessor runs automagically in Android
// Studio but not here?
tasks.register('rebuildAndRun') {
    dependsOn 'classes'
    dependsOn 'run'
    tasks.findByName('run').mustRunAfter 'classes'
}

// only suggest stable releases from 'gradle dependencyUpdates'
// via ben-manes/gradle-versions-plugin README
def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}
tasks.named('dependencyUpdates').configure {
    rejectVersionIf { isNonStable(it.candidate.version) }
}

// get current git hash, i.e. to reproduce the build. providers.exec runs
// lazily and is configuration-cache safe, unlike a plain exec {} here
def gitHash = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
}.standardOutput.asText.map { it.trim() }

// Add git commit to build for repeatability purposes
shadowJar {
    archiveAppendix = gitHash
    manifest {
        // JDK 24+ warns when JNI libraries (jSerialComm) load without this.
        // Only honored when launched via `java -jar`; ignored by older JVMs.
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
    // Let shadow's Kotlin module metadata transformer see every
    // *.kotlin_module file instead of warning that some may be dropped
    filesMatching('META-INF/*.kotlin_module') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

configurations.all {
    // Force out alien slf4j implementation
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'

    // Force out any log4j imports in favor of slf4j
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.name == 'log4j') {
            details.useTarget "org.slf4j:log4j-over-slf4j:1.7.5"
        }
    }
}

ext {
    daggerVersion = '2.24'
    ktorVersion = '2.3.13'
}

dependencies {
    implementation 'io.reactivex.rxjava2:rxjava:2.2.11'
    implementation 'com.fazecast:jSerialComm:2.11.4'
    implementation 'ch.qos.logback:logback-classic:1.2.3' // secretly this is also slf4j
    implementation 'org.xbib.jdbc:jdbc-driver-csv:1.2.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.github.ajalt:clikt:2.1.0'
    implementation 'com.github.kizitonwose.time:time:1.0.3'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    implementation "io.ktor:ktor-server-core:$ktorVersion"
    implementation "io.ktor:ktor-server-netty:$ktorVersion"
    implementation "io.ktor:ktor-serialization-gson:$ktorVersion"
    implementation "io.ktor:ktor-server-compression:$ktorVersion"
    implementation "io.ktor:ktor-server-locations:$ktorVersion"
    implementation "io.ktor:ktor-server-content-negotiation:$ktorVersion"

    implementation "com.google.dagger:dagger:$daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
}
